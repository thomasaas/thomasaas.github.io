  <style>

    @media (prefers-color-scheme:dark) { :root:not([data-theme="light"]) { --bg:#131816; --fg:#ecebe8; --muted:#a3a7ad; --faint:#29332e; --card:#1a211e; --accent:#7fd3a5; } }
    :root[data-theme="dark"] { --bg:#131816; --fg:#ecebe8; --muted:#a3a7ad; --faint:#29332e; --card:#1a211e; --accent:#7fd3a5; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--fg); font:17px/1.62 Georgia,"Iowan Old Style","Palatino Linotype",serif; }
    main { max-width:740px; margin:auto; padding:40px 16px 80px; }
    header, h1, h2, .meta, button { font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
    header { display:flex; align-items:center; justify-content:space-between; gap:16px; margin-bottom:3rem; }
    .brand { color:var(--fg); font-weight:700; text-decoration:none; font-size:.9rem; }
    .controls { display:flex; align-items:center; gap:16px; font-size:.85rem; }
    a { color:var(--accent); }
    a:focus-visible, button:focus-visible { outline:2px solid var(--accent); outline-offset:3px; }
    button { color:var(--fg); background:var(--card); border:1px solid var(--faint); border-radius:6px; padding:5px 9px; font-size:.8rem; cursor:pointer; }
    h1 { font-size:2.1rem; line-height:1.15; letter-spacing:-.01em; margin:0 0 1.5rem; }
    .posts { list-style:none; padding:0; margin:0; border-top:1px solid var(--faint); }
    .posts li { padding:1.2rem 0; border-bottom:1px solid var(--faint); }
    .posts h2 { font-size:1.05rem; line-height:1.35; margin:0 0 .2rem; }
    .posts h2 a { text-decoration:none; }
    .posts h2 a:hover { text-decoration:underline; }
    .meta { color:var(--muted); font-size:.85rem; }
    .posts p { margin:.4rem 0 0; }
    .follow { margin:-1rem 0 1.5rem; }
    @media(max-width:560px) { body { font-size:16px; } main { padding-top:28px; } header { margin-bottom:2.5rem; } h1 { font-size:1.65rem; } }
