  <style>
    :root { color-scheme:light dark; --bg:#f4efe6; --fg:#1c1a17; --muted:#6a6257; --faint:#e2d9ca; --card:#fbf8f2; --accent:#1f6c49; --tb-blob:#dce3cd; }

    body { margin:0; background:var(--bg); color:var(--fg); font:17px/1.62 Georgia,"Iowan Old Style","Palatino Linotype",serif; }

    /* plates, notes, boxes */
    figure { border-radius: 4px; border-color: var(--faint); box-shadow: 0 1px 0 var(--faint), 0 12px 28px -22px rgba(40, 30, 10, .35) }
    figure h4 { font-size: .95rem; letter-spacing: -.005em }

    .theme-btn { background: transparent }

    /* home page */
    main > h1 { font-size: clamp(2.4rem, 6vw, 3.4rem); line-height: 1.02; letter-spacing: -.025em; font-weight: 650; margin: 0 0 .8rem }

    .posts li .meta { grid-column: 1; grid-row: 1 / span 2; padding-top: .55rem; font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Consolas, monospace; font-size: .72rem;

    .posts h2 { grid-column: 2; grid-row: 1; font-size: 1.75rem; line-height: 1.12; letter-spacing: -.02em; margin: 0 0 .45rem }
    .posts h2 a { color: var(--fg); text-decoration: none }
    .posts h2 a:hover { color: var(--accent); text-decoration: none }
    .posts p { grid-column: 2; grid-row: 2; margin: 0; color: var(--muted); font-style: italic; font-size: 1.05rem; line-height: 1.45 }

    @media (max-width: 560px) {
      body { font-size: 17.5px }
      .subtitle { font-size: 1.15rem }
      article > h2 { font-size: 1.5rem }
      .posts li { grid-template-columns: 1fr }
      .posts li .meta { grid-row: auto; padding: 0 0 .4rem }
      .posts h2, .posts p { grid-column: 1; grid-row: auto }
      .posts h2 { font-size: 1.5rem }
    }

 Q71.43 64.73 67.73 67.39 L52.93 78" stroke="var(--accent)"/></g></g></g></svg><span>thomasaas</span></a><button class="theme-btn" type="button" aria-label="Switch colour theme"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button></header>

  <script>
    // TB logo: on hover the mark turns into a smiling face, the T curves a little more, then it winks.
    // Touch devices (no hover) get the animation once as a greeting after load; tapping the logo
    // when it links to the current page plays it again instead of reloading.
    (function () {
      var link = document.querySelector('.tb-home');
      if (!link) return;
      var rots = link.querySelectorAll('.tb-rot');
      var stems = link.querySelectorAll('.tb-stem');
      var eyes = link.querySelectorAll('.tb-eyeB');
      var EYE = 'M52.93 51.46 L67.73 62.08 Q71.43 64.73 67.73 67.39 L52.93 78';
      var LID = 'M62.18 51.46 V78';
      var REST = 7, TURN = 9, DUR = 600, HOLD = 1300;
      var mq = function (q) { return window.matchMedia ? window.matchMedia(q).matches : false; };
      var reduce = mq('(prefers-reduced-motion: reduce)');
      var canHover = mq('(hover: hover)');
      var p = 0, target = 0, raf = 0, last = 0, timers = [], back = 0;
      function easeOutBack(x) { var c1 = 1.4, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); }
      function easeInOut(x) { return x < 0.5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2; }
      function each(list, fn) { for (var i = 0; i < list.length; i++) fn(list[i]); }
      function draw() {
        var deg = p === 0 ? 0 : -90 * easeOutBack(p);
        var sm = REST + (TURN - REST) * easeInOut(p);
        each(rots, function (r) { r.setAttribute('transform', 'rotate(' + deg.toFixed(2) + ' 50 50)'); });
        each(stems, function (s) { s.setAttribute('d', 'M32 22 Q' + (32 - sm).toFixed(2) + ' 50 32 78'); });
      }
      function setEye(d) { each(eyes, function (e) { e.setAttribute('d', d); }); }
      function wink(delay) {
        timers.push(setTimeout(function () { setEye(LID); }, delay));
        timers.push(setTimeout(function () { setEye(EYE); }, delay + 400));
      }
      function reset() { timers.forEach(clearTimeout); timers = []; setEye(EYE); }
      function step(ts) {
        if (!last) last = ts;
        var dt = ts - last; last = ts;
        var dir = target > p ? 1 : -1;
        p += dir * dt / DUR;
        var done = dir > 0 ? p >= target : p <= target;
        if (done) p = target;
        draw();
        if (done) { raf = 0; if (p === 1) wink(250); return; }
        raf = requestAnimationFrame(step);
      }
      function go(t) {
        reset();
        if (reduce) { if (t === 1) wink(0); return; }
        target = t;
        if (!raf) { last = 0; raf = requestAnimationFrame(step); }
      }
      // Full sequence for touch: turn, smile, wink, then turn back on its own.
      function playOnce() {
        clearTimeout(back);
        go(1);
        back = setTimeout(function () { go(0); }, reduce ? 500 : DUR + HOLD);
      }
      function samePage() {
        var norm = function (path) { return path.replace(/index\.html$/, ''); };
        return norm(new URL(link.href, location.href).pathname) === norm(location.pathname);
      }
      // Mouse hover only; touch taps fire emulated mouse events that would leave it stuck as a face.
      link.addEventListener('pointerenter', function (e) { if (e.pointerType === 'mouse') { clearTimeout(back); go(1); } });
      link.addEventListener('pointerleave', function (e) { if (e.pointerType === 'mouse') go(0); });
      // Keyboard focus behaves like hover.
      link.addEventListener('focus', function () { if (link.matches(':focus-visible')) go(1); });
      link.addEventListener('blur', function () { go(0); });
      // On the page the logo links to, a tap or click replays the animation instead of reloading.
      link.addEventListener('click', function (e) {
        if (!samePage()) return;
        e.preventDefault();
        playOnce();
      });
      if (!canHover) {
        var greet = function () { setTimeout(playOnce, 900); };
        if (document.readyState === 'complete') greet(); else window.addEventListener('load', greet);
      }
    })();
  </script>
  <script>
    // Light/dark toggle: follows the system until clicked, then remembers the choice.
    (function () {
      var b = document.querySelector('.theme-btn');
      if (!b) return;
      var root = document.documentElement, mq = window.matchMedia('(prefers-color-scheme: dark)');
      var MOON = '<svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>', SUN = '<svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
      function cur() { var t = root.dataset.theme; return t === 'light' || t === 'dark' ? t : (mq.matches ? 'dark' : 'light'); }
      function sync() {
        var dark = cur() === 'dark';
        b.innerHTML = dark ? SUN : MOON;
        b.setAttribute('aria-label', dark ? 'Switch to light mode' : 'Switch to dark mode');
        b.title = dark ? 'Light mode' : 'Dark mode';
      }
      b.addEventListener('click', function () {
        var next = cur() === 'dark' ? 'light' : 'dark';
        root.dataset.theme = next;
        try { localStorage.setItem('blog-theme', next); } catch (_) {}
        sync();
      });
      if (mq.addEventListener) mq.addEventListener('change', sync);
      sync();
    })();
  </script>
